version: "2"
linters:
  default: standard
  enable:
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - noctx
    - errorlint
    - exhaustive
    - exptostd
    - gomodguard_v2
    - gomoddirectives
    - gosec
    - iface
    - interfacebloat
    - intrange
    - makezero
    - nolintlint
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - predeclared
    - promlinter
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - sloglint
    - spancheck
    - testifylint
    - thelper
    - unconvert
    - unqueryvet
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl_v5
  settings:
   
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: true
      context: scope
      key-naming-case: snake
      msg-style: lowercased
      static-msg: true
    spancheck:
      checks:
        - end
        - record-error
        - set-status
      ignore-check-signatures:
        - recordSpanError
formatters:
  enable:
    - gci
    - gofumpt
    - golines
  settings:
    golines:
      max-len: 120
    gofumpt:
      module-path: github.com/nimdanitro/go-sonos-kids
    gci:
      sections:
        - standard
        - blank
        - dot
        - alias
        - default
        - prefix(github.com/nimdanitro)
        - localmodule
      no-inline-comments: true
      no-prefix-comments: true
      custom-order: true
      no-lex-order: true
