name: CI

# One workflow for everything: the UI and Go checks run on every push and pull
# request; the container image is built (and, off pull requests, published) once
# both pass; a `v*` tag additionally creates the GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: jobs that need more say so themselves.
permissions:
  contents: read

# A newer push to a pull request supersedes the older run. Runs on main and on
# tags are never cancelled: a release has to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The Yarn version is pinned by the packageManager field in ui/package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Install packages
        run: yarn install --immutable

      - name: Lint
        run: yarn lint:github

      - name: Check formatting
        run: yarn fmt:check

      # Typechecks, then builds into ui/build, which the Go binary embeds.
      - name: Build
        run: yarn build

      - name: Upload the build for the image and the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-build
          path: ui/build/
          retention-days: 1
          if-no-files-found: error

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # ui.Assets embeds ui/build; the committed ui/build/.gitkeep keeps the
      # package compiling without a built UI, so this job needs no UI artifact.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-only: true
          version: v2.14.0

      # --diff reports and fails; a bare `fmt` rewrites the checkout and exits 0,
      # which would never fail a build.
      - name: Check formatting
        run: golangci-lint fmt --diff ./...

      - name: Lint
        run: golangci-lint run ./...

      - name: Test
        run: go test -race -count=1 ./...

  image:
    name: Container image
    # Never publish an image from a commit whose checks fail.
    needs: [ui, go]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io
    env:
      KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git describe` below needs the tags; a shallow clone would quietly
          # degrade the version to a bare commit hash.
          fetch-depth: 0
          persist-credentials: false

      - name: Download the UI build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-build
          path: ui/build/

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Installs ko and logs in to ghcr.io with the workflow's token.
      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # A release tag (vX.Y.Z) also gets `latest`; branch builds do not.
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          # ko splits --image-label values on commas, and the repository
          # description (the default for this label) contains some, so no
          # commas here. `source` is what links the package to this repository
          # on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Touch-friendly Sonos music player for kids - Go and React in a single binary

      - name: Build, smoke-test, and publish
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail

          # Anchors every build to the last release and counts from it
          # (v1.2.0-14-gabc1234); `sonoskids --version` reports it.
          VERSION="$(git describe --tags --always)"
          export VERSION

          tags=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tags="${tags:+$tags,}${tag#"$KO_DOCKER_REPO:"}"
          done <<< "$TAGS"
          labels=()
          while IFS= read -r label; do
            [ -n "$label" ] && labels+=(--image-label "$label")
          done <<< "$LABELS"
          echo "Building $VERSION with tags: $tags"

          # 1. Build both architectures without pushing, and prove the image
          #    starts and serves before anything is published.
          ko build --bare --push=false --platform=linux/amd64,linux/arm64 \
            --tags "$tags" "${labels[@]}" .
          scripts/smoke-test-image.sh "$KO_DOCKER_REPO:${tags%%,*}"

          # 2. Publish, except from pull requests (which cannot write packages).
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            ko build --bare --platform=linux/amd64,linux/arm64 \
              --tags "$tags" "${labels[@]}" --image-refs published.refs .
            {
              echo "### Published"
              echo
              echo "\`$VERSION\`"
              echo
              sed 's/^/- `/; s/$/`/' published.refs
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: GitHub release
    # Tags only (`v*`): attach binaries and write the release notes.
    if: github.ref_type == 'tag'
    needs: [ui, go, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its files
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog reads the history and the tags
          persist-credentials: false

      - name: Download the UI build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-build
          path: ui/build/

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Range from the previous *stable* tag, so the notes of a final release also
      # cover what changed since the last release candidate.
      - name: Resolve the changelog range
        id: range
        run: |
          current="${GITHUB_REF_NAME}"
          previous="$(git tag --list 'v*' --sort=-v:refname --merged "$current" \
            | grep -vE -- '-(rc|alpha|beta)' \
            | grep -vxF "$current" \
            | head -n1 || true)"
          echo "range=${previous:+$previous..}$current" >> "$GITHUB_OUTPUT"
          echo "Changelog range: ${previous:-<start>}..$current"

      - name: Generate the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: ${{ steps.range.outputs.range }} --strip header --output ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_REPO: ${{ github.repository }}
          # Needed to read the repository through the API, which is how the notes
          # find contributors; without it a private repository answers 404.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the binaries and create the release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
