# git-cliff configuration: release notes from Conventional Commits.
# https://git-cliff.org/docs/configuration
#
# The release workflow runs it for each `v*` tag and passes the result to
# GoReleaser as the body of the GitHub release.

[remote.github]
owner = "nimdanitro"
repo = "go-sonos-kids"

[changelog]
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          ({{ self::remote_url() }}/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
{%- if github -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | filter(attribute="username") | length != 0 %}
  ## New Contributors ❤️
{% endif %}\
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) | filter(attribute="username") %}
  * @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{%- endfor -%}
{%- endif %}
"""
# remove the leading and trailing whitespace from the templates
trim = true

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# keep commits that are not conventional (they land in "Other") rather than
# dropping them silently
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
    # turn "(#12)" into a link to the pull request
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/nimdanitro/go-sonos-kids/issues/${2}))" },
    # a Dependabot title that is not conventional
    { pattern = '^Bump', replace = "chore(deps): update" },
]

# regex for parsing and grouping commits; the first matching parser wins, and
# the <!-- n --> comments only fix the order of the sections
commit_parsers = [
    { message = "^feat", group = "<!-- 00 -->⛰️  Features" },
    { body = "^chore\\(security\\):|^security: ", group = "<!-- 08 -->🛡️ Security" },
    { message = "^security", group = "<!-- 08 -->🛡️ Security" },
    { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
    { message = "^doc", group = "<!-- 03 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 04 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 02 -->🚜 Refactor" },
    { message = "^style", group = "<!-- 05 -->🎨 Styling" },
    { message = "^test", group = "<!-- 06 -->🧪 Testing" },
    # noise that does not belong in release notes
    { message = "^chore\\(release\\):|^chore: (r|R)elease|^chore: prepare release", skip = true },
    { message = "^chore\\(deps-dev\\)", skip = true },
    { message = "^ci\\(deps", skip = true },
    { message = "^chore\\(changelog\\):", skip = true },
    { message = "^chore\\(deps", group = "<!-- 07 -->📦 Dependencies" },
    { message = "^chore|^ci|^build", group = "<!-- 07 -->⚙️  Other" },
    { message = "^revert", group = "<!-- 09 -->◀️  Revert" },
    # anything that is not conventional
    { message = ".*", group = "<!-- 10 -->📝 Other" },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = true
# filter out the commits that are not matched by commit parsers
filter_commits = false
# regex for matching git tags
tag_pattern = "v[0-9].*"
# regex for skipping tags
skip_tags = "beta|alpha"
# regex for ignoring tags
ignore_tags = "rc"
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "newest"
